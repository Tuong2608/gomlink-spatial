<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Sổ Gom Link — Spatial Glass</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-bg-hover: rgba(255, 255, 255, 0.14);
      --glass-card: rgba(255, 255, 255, 0.09);
      --glass-border-top: rgba(255, 255, 255, 0.28);
      --glass-border-side: rgba(255, 255, 255, 0.12);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.62);
      --text-muted: rgba(255, 255, 255, 0.42);
      --accent-cyan: #38bdf8;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-orange: #f97316;
      --accent-danger: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 440px;
      min-height: 490px;
      max-height: 580px;
      font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      color: var(--text-main);
      background: #12151e;
      position: relative;
      overflow: hidden;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }

    /* Ambient Atmospheric Orbs (chuẩn hiệu ứng ánh sáng xuyên qua kính mờ) */
    .ambient-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: radial-gradient(circle at 15% 15%, #1e293b 0%, #0f1117 70%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.65;
    }

    .orb-amber {
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, #f97316 0%, #eab308 60%, transparent 100%);
      top: -50px;
      right: -40px;
      opacity: 0.5;
    }

    .orb-cyan {
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #0ea5e9 0%, #3b82f6 65%, transparent 100%);
      bottom: -60px;
      left: -50px;
      opacity: 0.45;
    }

    .orb-warm {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, #fb923c 0%, #a855f7 70%, transparent 100%);
      top: 42%;
      left: 32%;
      opacity: 0.28;
    }

    /* Lớp kính mờ chung (Frosted Spatial Glass) */
    .glass-panel {
      position: relative;
      z-index: 1;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--glass-border-top);
      border-left: 1px solid rgba(255, 255, 255, 0.18);
      border-right: 1px solid var(--glass-border-side);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 10px 28px rgba(0, 0, 0, 0.32);
      border-radius: 18px;
    }

    /* Header Bar */
    .top-bar {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .brand-text h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .brand-text p {
      font-size: 10.5px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      display: inline-block;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.28);
      border-left: 1px solid rgba(255, 255, 255, 0.16);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .pill-btn.active {
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.22);
    }

    /* Metrics Glass Strip (Lấy cảm hứng từ khung 76k / 1.5m / $3.6k trong mẫu) */
    .metrics-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 10px 14px;
      gap: 8px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-right: 1px solid rgba(255, 255, 255, 0.09);
      padding-right: 8px;
    }

    .metric-item:last-child {
      border-right: none;
      padding-right: 0;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1.1;
      color: #ffffff;
    }

    .metric-label {
      font-size: 10.5px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-cyan { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); }
    .dot-emerald { background: var(--accent-emerald); box-shadow: 0 0 6px var(--accent-emerald); }
    .dot-amber { background: var(--accent-amber); box-shadow: 0 0 6px var(--accent-amber); }

    /* Khu vực Danh sách Thẻ Kính (Cards View) */
    .workspace-container {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 255px;
      max-height: 310px;
    }

    .cards-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 3px;
    }

    .cards-list::-webkit-scrollbar {
      width: 5px;
    }
    .cards-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .cards-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 99px;
    }

    .link-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 9px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.16s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .link-card:hover {
      background: var(--glass-bg-hover);
      border-top-color: rgba(255, 255, 255, 0.38);
      transform: translateY(-1px);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .platform-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .card-info {
      min-width: 0;
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .platform-tag {
      font-size: 9.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 10.5px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      text-decoration: none;
    }

    .card-url:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .icon-btn.del:hover {
      background: rgba(244, 63, 94, 0.35);
      border-color: rgba(251, 113, 133, 0.5);
      color: #ffe4e6;
    }

    /* Empty State Kính Mờ */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
      color: var(--text-sub);
      gap: 8px;
    }

    .empty-orb {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 2px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .empty-state h3 {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }

    .empty-state p {
      font-size: 11px;
      line-height: 1.45;
      max-width: 280px;
    }

    /* Chế độ Sửa Raw Markdown */
    textarea#note {
      width: 100%;
      flex: 1;
      background: rgba(15, 18, 28, 0.45);
      backdrop-filter: blur(20px);
      color: #f8fafc;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(255, 255, 255, 0.14);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 11px;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.5;
      white-space: pre;
      outline: none;
      resize: none;
      display: none;
    }

    textarea#note:focus {
      border-color: rgba(255, 255, 255, 0.42);
    }

    /* Thanh Dock Điều Khiển Dưới Cùng */
    .bottom-dock {
      padding: 9px;
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dock-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* Nút chính nổi bật kiểu Pill Trắng Sáng như nút "Start Now" trong ảnh mẫu */
    .dock-btn.primary {
      flex: 1.35;
      background: rgba(255, 255, 255, 0.94);
      color: #0f172a;
      border-color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.22);
    }

    .dock-btn.primary:hover {
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.34);
    }

    .dock-btn.danger {
      flex: 0.65;
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(251, 113, 133, 0.32);
      color: #fecdd3;
    }

    .dock-btn.danger:hover {
      background: rgba(244, 63, 94, 0.32);
      color: #ffffff;
    }

    .footer-hint {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
      color: var(--text-sub);
      padding: 0 4px;
    }

    kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 1px 5px;
      border-radius: 5px;
      font-size: 9.5px;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Lớp ánh sáng nền đa sắc xuyên qua kính mờ -->
  <div class="ambient-canvas">
    <div class="orb orb-amber"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-warm"></div>
  </div>

  <!-- Thanh tiêu đề & chuyển đổi chế độ -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-badge">✨</div>
      <div class="brand-text">
        <h1>Gom Link Spatial</h1>
        <p><span class="live-dot"></span> <span id="status">Đồng bộ inbox_links.md</span></p>
      </div>
    </div>
    <div class="header-actions">
      <button id="add-current-btn" class="pill-btn" title="Lưu thêm tab đang mở vào Sổ">➕ Lưu tab này</button>
      <button id="toggle-view-btn" class="pill-btn" title="Chuyển đổi giữa Thẻ Kính và Sửa Text">📝 Sửa Raw</button>
    </div>
  </div>

  <!-- Thanh chỉ số Metrics Glassmorphism -->
  <div class="glass-panel metrics-strip">
    <div class="metric-item">
      <div id="inbox-stat" class="metric-value">0</div>
      <div class="metric-label"><span class="dot dot-cyan"></span> Chờ đọc</div>
    </div>
    <div class="metric-item">
      <div id="archive-stat" class="metric-value">0</div>
      <div class="metric-label"><span class="dot dot-emerald"></span> Đã phân tích</div>
    </div>
    <div class="metric-item">
      <div id="source-stat" class="metric-value">—</div>
      <div class="metric-label"><span class="dot dot-amber"></span> Nguồn chính</div>
    </div>
  </div>

  <!-- Không gian hiển thị danh sách Thẻ Kính hoặc Raw Editor -->
  <div class="workspace-container">
    <div id="cards-view" class="cards-list"></div>
    <textarea id="note" placeholder="Danh sách link sẽ nối đuôi tại đây..."></textarea>
  </div>

  <!-- Thanh điều khiển Glass Dock -->
  <div class="glass-panel bottom-dock">
    <button id="copy" class="dock-btn primary">📋 Copy gửi Agent</button>
    <button id="copy-urls" class="dock-btn">🔗 Lấy URLs</button>
    <button id="clear" class="dock-btn danger">🗑️ Xóa</button>
  </div>

  <div class="footer-hint">
    <span>Click trái Icon hoặc <kbd>Alt</kbd>+<kbd>S</kbd> để lưu ngầm</span>
    <span>Chuột phải Icon → Mở Sổ</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
